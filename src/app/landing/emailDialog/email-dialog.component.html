<div class="dialog">
<mat-dialog-content>
  <h2 mat-dialog-title>Enter your email:</h2>
  <input class="form-control" [(ngModel)]="email">
  <small class="text-muted">We don't share any user information with 3rd parties.</small>
</mat-dialog-content>
<mat-dialog-actions>
  <button mat-raised-button color="grey" (click)="close()">Close</button>
  <button mat-raised-button color="accent" (click)="save()">Submit</button>
</mat-dialog-actions>
</div>
